name: Build GUI (Windows)

on:
  push:
    tags: ["gui-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.7.3 matplotlib==3.9.2 numpy==2.1.3 pyinstaller==6.11.1 pytest

      - name: Run tests
        run: pytest tests/ -q

      - name: Build GUI .exe
        run: |
          pyinstaller --onefile --windowed --name orbit-calc-gui `
            --add-data "core;core" `
            --add-data "gui;gui" `
            --add-data "cli;cli" `
            --hidden-import=core.astrodynamics `
            --hidden-import=core.lambert `
            --hidden-import=core.latex_formulas `
            --hidden-import=core.base `
            --hidden-import=cli.calculator `
            --collect-data matplotlib `
            gui/__main__.py

      - name: Rename
        shell: bash
        run: |
          ls -lh dist/
          mv dist/orbit-calc-gui.exe dist/orbit-calc-gui-windows-x86_64.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-calc-gui-windows
          path: dist/orbit-calc-gui-windows-x86_64.exe
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/orbit-calc-gui-windows-x86_64.exe
          generate_release_notes: true
